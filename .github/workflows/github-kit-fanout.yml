name: github-kit fan-out (propagate bootstrap updates)

# Closes the one gap in github-kit's "always-latest" model.
#
# Reusable CI workflows (reusable-*.yml) already auto-track @main: any repo that calls
# `uses: pzoli6/github-kit/.github/workflows/reusable-*.yml@main` gets fixes on its next run.
# But the *local* bootstrap files copied into each repo — AGENTS.md/CLAUDE.md/GEMINI.md managed
# blocks, skills, Cursor rules, REVIEW.md, docs/ai/*, and scripts/project/* — do
# NOT auto-track; historically they only refreshed when a human ran /github_kit_update.
#
# This workflow makes that automatic. On every push to main that changes template/script content
# (plus a weekly safety net, plus manual dispatch), it refreshes each target repo listed in the
# fan-out registry from github-kit@main and opens a DRAFT PR whenever anything drifted.
# It never merges, never overwrites an existing docs/ai/PROJECT_CONFIG.md (only an explicit
# "install": true creates the template one), and never force-pushes. Its PRs change
# .github/workflows/*, which the kit's auto-merge.yml can merge only when the target has an
# AUTOMERGE_TOKEN with the workflow permission (GitHub refuses workflow-file merges from
# GITHUB_TOKEN) -- otherwise the owner merges them by hand. The fan-out itself only opens drafts.
#
# THE REGISTRY IS NOT IN THIS REPOSITORY. github-kit is public; the list of repositories it
# maintains is not. The registry is the repository Actions VARIABLE `FANOUT_TARGETS` of github-kit
# (Settings -> Secrets and variables -> Actions -> Variables), holding the JSON documented in
# .github/fanout-targets.example.json; scripts/fanout-registry.sh reads, checks and stores it.
# Nothing about a target may reach this public repo's run pages, so:
#   - the registry is read INSIDE a step with `gh variable get` (through the fan-out token), never
#     through `env:` or `with:` before masking -- the runner prints those in every step header;
#   - every target name is registered with ::add-mask:: as the first thing each job does, so it
#     shows as *** wherever a tool prints it afterwards (git, gh, this workflow's own log);
#   - the matrix carries one per-run OPAQUE LABEL per entry -- HMAC-SHA256 of "<run id>:<index>",
#     keyed with the FANOUT_LABEL_KEY secret (or, while that secret is absent, FANOUT_TOKEN), cut to
#     12 hex chars -- so job names read "fanout (3f9c2a1b7e0d)" and tell an observer nothing, not
#     even a stable position: every run relabels. Map a label back with
#     `scripts/fanout-registry.sh which <run id> <label>` (needs the same key locally);
#   - every later step reads its entry from a snapshot file the first step wrote, and the target is
#     cloned with plain git from that snapshot, so neither a name nor an index ever travels through
#     a `with:`/`env:` expression or a step output (the runner drops outputs that contain a masked
#     value anyway, with "Skip output ... since it may contain secret");
#   - the `only_repo` dispatch input takes the entry's 0-based index (an owner/name also works, but
#     then the name sits in the run's inputs);
#   - each run plans its targets from ONE read of the registry in `discover`, and every fan-out job
#     checks its own fresh read against a key-HMAC fingerprint of that snapshot, so a registry
#     stored mid-run fails the job instead of acting on a shifted index;
#   - storing a changed registry triggers nothing by itself (it is a variable, not a push):
#     dispatch this workflow after `scripts/fanout-registry.sh set`, or wait for the weekly cron.
#
# Per-target entry: { "repo": "owner/name", "base": "<branch>", "install": true, "tier": 1,
#                     "variables": { ... } }
#   base      optional -- the branch the draft PR targets; omitted = the repo's default branch,
#             resolved at run time (gh api repos/<repo> .default_branch).
#   install   optional, default false -- a target WITHOUT the kit installed (no
#             docs/ai/PROJECT_CONFIG.md at the base branch) is skipped with a visible log line
#             and no PR. Only "install": true makes fan-out run the full installer there; the kit
#             is never silently installed into a repo that never had it.
#   tier      optional, default 1 -- passed to the updater/installer as --tier (README ->
#             "Repository tiers").
#   variables optional -- repository Actions variables a human applies with
#             scripts/apply-repo-variables.sh; the fan-out never touches them.
#
# Requires one repository secret in github-kit: FANOUT_TOKEN. Recommended second secret:
# FANOUT_LABEL_KEY (any random string, e.g. `openssl rand -hex 32`), the key of the job labels, so
# the owner can resolve a label without keeping the PAT at hand (docs/OWNER_SETUP.md -> Step 1c).
#
# NOTE ON THE NAME: it must NOT start with "GITHUB_". GitHub reserves that prefix and rejects any
# secret named with it, so the previously-documented "GITHUB_KIT_FANOUT_TOKEN" was impossible to
# create -- which is why fan-out failed on every run before 2026-07-30. Do not rename it back.
#
# The token must reach EVERY target with "Contents: Read and write" + "Pull requests: Read and
# write", and nothing else. The default GITHUB_TOKEN cannot reach other repos at all, which is why
# a PAT is needed. It needs BOTH the "repo" AND "workflow" scopes -- without "workflow", git
# rejects the push the moment a target's .github/workflows/*.yml changes, which happens after
# checkout/refresh/commit all succeed, so it reads like a target-repo permissions problem. The
# `repo` scope also lets it read the FANOUT_TARGETS variable of github-kit (a fine-grained token
# would additionally need "Variables: Read" on github-kit).
# Use a CLASSIC PAT when targets span more than one account:
# a fine-grained PAT is scoped to a single resource owner and cannot select repos you are only an
# outside collaborator on. See docs/OWNER_SETUP.md.

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'scripts/install-github-kit.sh'
      - 'scripts/update-github-kit.sh'
      - '.github/workflows/github-kit-fanout.yml'
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC — catches anything a path-filtered push missed
  workflow_dispatch:
    inputs:
      only_repo:
        description: 'Limit fan-out to one target: its 0-based index in the FANOUT_TARGETS registry (keeps the name out of this public run), or owner/name. Blank = all targets.'
        required: false
        default: ''

permissions:
  contents: read   # only used to check out github-kit itself; targets are reached via the PAT

concurrency:
  group: github-kit-fanout
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      count: ${{ steps.set.outputs.count }}
      fingerprint: ${{ steps.set.outputs.fingerprint }}
    steps:
      - id: set
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FANOUT_TOKEN }}
          LABEL_KEY: ${{ secrets.FANOUT_LABEL_KEY }}
          ONLY_REPO: ${{ github.event.inputs.only_repo }}
        run: |
          set -euo pipefail
          # Read through env and tested for emptiness only — the value is never echoed.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::FANOUT_TOKEN secret is not set in github-kit. Create a CLASSIC PAT with BOTH the repo and workflow scopes (workflow is required because fan-out updates .github/workflows/*.yml in targets) and add it as this secret. See docs/OWNER_SETUP.md."
            exit 1
          fi
          # Key of the per-run job labels and of the registry fingerprint: FANOUT_LABEL_KEY when the
          # owner stored one (docs/OWNER_SETUP.md -> Step 1c), else the fan-out token itself.
          KEY="${LABEL_KEY:-$GH_TOKEN}"
          # The label of registry entry $1 for this run. Must stay identical to label_for() in
          # scripts/fanout-registry.sh (the doctor checks the recipe).
          label_for() { printf '%s:%s' "$GITHUB_RUN_ID" "$1" | openssl dgst -sha256 -hmac "$KEY" | awk '{print $NF}' | cut -c1-12; }
          # The registry is read here, inside the step, so that no step header prints it.
          if ! registry="$(gh variable get FANOUT_TARGETS --repo "$GITHUB_REPOSITORY" 2> /dev/null)" || [ -z "$registry" ]; then
            echo "::error::The FANOUT_TARGETS repository variable is not set in ${GITHUB_REPOSITORY} (or FANOUT_TOKEN cannot read its variables). It holds the fan-out registry: the JSON described in .github/fanout-targets.example.json. Store it with scripts/fanout-registry.sh set <file>; see docs/OWNER_SETUP.md -> Step 1b."
            exit 1
          fi
          if ! jq -e '(.targets | type) == "array" and (.targets | length) > 0
                      and all(.targets[]; (.repo | type) == "string" and (.repo | test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")))' \
                 <<< "$registry" > /dev/null 2>&1; then
            echo "::error::FANOUT_TARGETS is not a valid fan-out registry (expected {\"targets\": [{\"repo\": \"owner/name\", ...}, ...]}). Check it with scripts/fanout-registry.sh check <file> and store it again with scripts/fanout-registry.sh set <file>."
            exit 1
          fi
          # Mask every target name before anything else is logged.
          while IFS= read -r r; do echo "::add-mask::$r"; done < <(jq -r '.targets[].repo' <<< "$registry")
          # Fingerprint of the registry this run plans from, keyed so the digest tells an observer
          # nothing; every fan-out job checks its own fresh read against it.
          fingerprint="$(printf '%s' "$registry" | openssl dgst -sha256 -hmac "$KEY" | awk '{print $NF}')"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          total="$(jq '.targets | length' <<< "$registry")"
          # One opaque label per entry; the matrix is sorted by label so that even the job order on
          # the run page carries no registry position.
          labels="$(for ((i = 0; i < total; i++)); do label_for "$i"; done)"
          if [ "$(sort <<< "$labels" | uniq -d | wc -l)" -ne 0 ]; then
            echo "::error::Two registry entries got the same job label for this run (a 48-bit collision). Re-run the workflow."
            exit 1
          fi
          if [ -z "$ONLY_REPO" ]; then
            matrix="$(jq -cRn '{include: ([inputs | {label: .}] | sort_by(.label))}' <<< "$labels")"
          elif [[ "$ONLY_REPO" =~ ^[0-9]+$ ]]; then
            if [ "$ONLY_REPO" -ge "$total" ]; then
              echo "::error::only_repo index $ONLY_REPO is out of range: the registry has $total target(s), indices 0-$((total - 1))."
              exit 1
            fi
            matrix="$(jq -cn --arg l "$(label_for "$ONLY_REPO")" '{include: [{label: $l}]}')"
          else
            idx="$(jq -r --arg r "$ONLY_REPO" '[.targets[].repo] | index($r) // empty' <<< "$registry")"
            if [ -z "$idx" ]; then
              echo "::error::only_repo names no registry entry. Pass the entry's 0-based index instead (scripts/fanout-registry.sh get); that also keeps the name out of this public run."
              exit 1
            fi
            matrix="$(jq -cn --arg l "$(label_for "$idx")" '{include: [{label: $l}]}')"
          fi
          count="$(jq '.include | length' <<< "$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Fan-out will consider $count of $total registered target(s). Jobs carry per-run labels; map one back with: scripts/fanout-registry.sh which $GITHUB_RUN_ID <label>"

  fanout:
    name: fanout (${{ matrix.label }})
    needs: discover
    if: ${{ needs.discover.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      # First, before any other step header can print anything about the target: mask every
      # target name for this job, resolve the job's label to its registry entry, and write that
      # entry to a snapshot file. Every later step reads the file, never the live variable, so one
      # job works on one registry throughout and no name or index travels through `with:`/`env:`.
      - name: Resolve the registry entry (names masked)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FANOUT_TOKEN }}
          LABEL_KEY: ${{ secrets.FANOUT_LABEL_KEY }}
          LABEL: ${{ matrix.label }}
          EXPECTED_FINGERPRINT: ${{ needs.discover.outputs.fingerprint }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::FANOUT_TOKEN secret is not set in github-kit. See docs/OWNER_SETUP.md."
            exit 1
          fi
          KEY="${LABEL_KEY:-$GH_TOKEN}"
          label_for() { printf '%s:%s' "$GITHUB_RUN_ID" "$1" | openssl dgst -sha256 -hmac "$KEY" | awk '{print $NF}' | cut -c1-12; }
          registry="$(gh variable get FANOUT_TARGETS --repo "$GITHUB_REPOSITORY")"
          while IFS= read -r r; do echo "::add-mask::$r"; done < <(jq -r '.targets[].repo' <<< "$registry")
          # The label is meaningful only for the registry `discover` planned from. A registry
          # stored while this run was queued or running could shift the entries, so a fresh read
          # that differs from the planned snapshot stops this job before it touches anything.
          fingerprint="$(printf '%s' "$registry" | openssl dgst -sha256 -hmac "$KEY" | awk '{print $NF}')"
          if [ "$fingerprint" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::The FANOUT_TARGETS registry changed after this run planned its targets, so job $LABEL may now name a different repository. Nothing was touched; re-run the workflow."
            exit 1
          fi
          total="$(jq '.targets | length' <<< "$registry")"
          index=""
          for ((i = 0; i < total; i++)); do
            if [ "$(label_for "$i")" = "$LABEL" ]; then index="$i"; break; fi
          done
          if [ -z "$index" ]; then
            echo "::error::Job label $LABEL resolves to no entry of this run's registry (was FANOUT_LABEL_KEY changed while the run was in flight?). Nothing was touched; re-run the workflow."
            exit 1
          fi
          jq -c --argjson i "$index" '.targets[$i]' <<< "$registry" > "$RUNNER_TEMP/target.json"
          echo "Job $LABEL is $(jq -r '.repo' "$RUNNER_TEMP/target.json") (shown masked), tier $(jq -r '.tier // 1' "$RUNNER_TEMP/target.json")."

      - name: Checkout github-kit (source of truth)
        uses: actions/checkout@v5
        with:
          path: github-kit

      - name: Resolve target base branch
        env:
          GH_TOKEN: ${{ secrets.FANOUT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_REPO="$(jq -r '.repo' "$RUNNER_TEMP/target.json")"
          TARGET_BASE="$(jq -r '.base // ""' "$RUNNER_TEMP/target.json")"
          if [ -n "$TARGET_BASE" ]; then
            echo "Base branch for ${TARGET_REPO}: ${TARGET_BASE} (from the registry entry)."
          else
            # `|| true` so a 403/404 reaches the explicit error below instead of aborting the step
            # under `set -e` with only gh's own message.
            TARGET_BASE="$(gh api "repos/${TARGET_REPO}" --jq '.default_branch' || true)"
            if [ -z "$TARGET_BASE" ]; then
              echo "::error::Could not resolve the default branch of ${TARGET_REPO} — does FANOUT_TOKEN reach it?"
              exit 1
            fi
            echo "Base branch for ${TARGET_REPO}: ${TARGET_BASE} (repository default branch)."
          fi
          printf '%s' "$TARGET_BASE" > "$RUNNER_TEMP/target.base"

      - name: Checkout target repo
        env:
          GH_TOKEN: ${{ secrets.FANOUT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_REPO="$(jq -r '.repo' "$RUNNER_TEMP/target.json")"
          TARGET_BASE="$(cat "$RUNNER_TEMP/target.base")"
          # Plain git instead of actions/checkout: the repository name must not travel through a
          # `with:` expression (which would read the live variable again and print the value in
          # the step header), and a step output cannot carry a masked value. The token rides in
          # the remote URL on this ephemeral runner only; git and the runner both mask it.
          git clone --quiet --branch "$TARGET_BASE" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" target
          echo "Checked out ${TARGET_REPO} at ${TARGET_BASE}."

      - name: Check the kit is installed in the target
        id: gate
        env:
          LABEL: ${{ matrix.label }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_REPO="$(jq -r '.repo' "$RUNNER_TEMP/target.json")"
          INSTALL="$(jq -r '.install // false' "$RUNNER_TEMP/target.json")"
          if [ -e target/docs/ai/PROJECT_CONFIG.md ]; then
            echo "github-kit is installed in ${TARGET_REPO} (docs/ai/PROJECT_CONFIG.md present) — refreshing."
            echo "mode=update" >> "$GITHUB_OUTPUT"
          elif [ "$INSTALL" = "true" ]; then
            echo "github-kit is NOT installed in ${TARGET_REPO}, but its registry entry says \"install\": true — running the full installer."
            echo "mode=install" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Skipped job ${LABEL}::github-kit is not installed there (no docs/ai/PROJECT_CONFIG.md at the base branch) and the registry entry does not say \"install\": true — skipping, no PR opened. Add \"install\": true to that entry (scripts/fanout-registry.sh) to install the kit on the next run."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh bootstrap files from github-kit@main
        if: steps.gate.outputs.mode == 'update'
        shell: bash
        run: |
          set -euo pipefail
          TARGET_TIER="$(jq -r '(.tier // 1) | tostring' "$RUNNER_TEMP/target.json")"
          bash github-kit/scripts/update-github-kit.sh --target target --allow-dirty --ref main --tier "$TARGET_TIER"

      - name: 'Install github-kit (first install, opted in via "install": true)'
        if: steps.gate.outputs.mode == 'install'
        shell: bash
        run: |
          set -euo pipefail
          TARGET_TIER="$(jq -r '(.tier // 1) | tostring' "$RUNNER_TEMP/target.json")"
          bash github-kit/scripts/install-github-kit.sh --target target --mode merge --allow-dirty --ref main --tier "$TARGET_TIER"

      - name: Open draft PR if anything drifted
        if: steps.gate.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ secrets.FANOUT_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          MODE: ${{ steps.gate.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_REPO="$(jq -r '.repo' "$RUNNER_TEMP/target.json")"
          TARGET_BASE="$(cat "$RUNNER_TEMP/target.base")"
          cd target
          # Commit as github-actions[bot], NOT an invented "github-kit-bot" identity. Deployment
          # providers verify that a commit author resolves to a real GitHub account before they
          # will build: Vercel reports "GitHub couldn't verify an account for the commit" and marks
          # the check failed. github-kit-bot@users.noreply.github.com belongs to no account, so
          # every fan-out PR arrived with a red deploy check. This address is the real Actions bot.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage exactly the github-kit-owned paths: every file row of the kit manifest (the list
          # the updater itself writes from), plus .gitignore. This honours the "never git add -A"
          # rule, and a new template can never be forgotten here. `git add -A -- <path>` also
          # stages the deletion of a retired file the updater removed; a path that neither exists
          # nor is tracked is skipped, so `git add` never aborts on a missing pathspec.
          while IFS=$'\t' read -r kind p _rest; do
            [ "$kind" = "file" ] || continue
            if [ -e "$p" ] || git ls-files --error-unmatch -- "$p" > /dev/null 2>&1; then
              git add -A -- "$p"
            fi
          done < ../github-kit/templates/docs/ai/KIT_MANIFEST.tsv
          if [ -e .gitignore ]; then git add -- .gitignore; fi

          if git diff --cached --quiet; then
            echo "No drift for ${TARGET_REPO} — already in sync with github-kit@main."
            exit 0
          fi

          branch="agent/github-kit-selfupdate-${RUN_ID}"
          git switch -c "$branch"
          if [ "$MODE" = "install" ]; then
            commit_msg="chore(github-kit): install github-kit from github-kit@main"
            pr_title="chore(github-kit): install github-kit bootstrap files from github-kit@main"
          else
            commit_msg="chore(github-kit): propagate bootstrap updates from github-kit@main"
            pr_title="chore(github-kit): auto-propagate bootstrap updates from github-kit@main"
          fi
          git commit -m "$commit_msg"
          git push -u origin "$branch"

          body_file="${RUNNER_TEMP}/gk-fanout-body.md"
          cat > "$body_file" <<'BODY'
          Automated by `github-kit-fanout.yml` in `pzoli6/github-kit`.

          This PR refreshes this repo's github-kit **local bootstrap files** to match
          `pzoli6/github-kit@main`:

          - `AGENTS.md` / `CLAUDE.md` / `GEMINI.md` / `REVIEW.md` managed blocks
          - `.claude` / `.agents` skills and commands, `.cursor` rules
          - removes retired kit files you never edited (e.g. `.github/copilot-instructions.md`)
          - `docs/ai/AGENT_WORKFLOW.md`, `docs/ai/HANDOFF_INDEX.md`, `docs/ai/PROJECT_CONFIG.env.example`
          - `scripts/project/*` helper scripts and the reusable-workflow callers, including
            `.github/workflows/auto-merge.yml` (merge after green; hold any PR back with the
            `no-automerge` label)

          Reusable CI workflows already auto-track `@main`; this PR covers the local files that don't.

          Draft on purpose — review the diff, then merge it yourself. It changes `.github/workflows/*`,
          and GitHub refuses workflow-file merges from `GITHUB_TOKEN`, so `auto-merge.yml` can merge it
          only if this repo has an `AUTOMERGE_TOKEN` with the workflow permission; with one, marking it
          ready merges it once its checks are green. This automation itself never merges.

          Relationships: none declared.
          BODY
          if [ "$MODE" = "install" ]; then
            {
              echo
              echo "**First install** (\`\"install\": true\` on this repo's entry in github-kit's fan-out registry): this PR adds the"
              echo "whole kit, including a template \`docs/ai/PROJECT_CONFIG.md\` — fill in its base branch, validation"
              echo "commands and forbidden files before merging. Your issue/PR templates are only added where missing."
            } >> "$body_file"
          else
            {
              echo
              echo "It does **not** touch \`docs/ai/PROJECT_CONFIG.md\` or your issue/PR templates. The exact file"
              echo "list is \`docs/ai/KIT_MANIFEST.tsv\`; the CI callers carry this repo's Actions-budget tier"
              echo "from its entry in github-kit's fan-out registry (\`# github-kit tier: N\`)."
            } >> "$body_file"
          fi

          gh pr create \
            --repo "${TARGET_REPO}" \
            --base "${TARGET_BASE}" \
            --head "$branch" \
            --draft \
            --title "$pr_title" \
            --body-file "$body_file"
          echo "Opened draft PR for ${TARGET_REPO} (${branch} -> ${TARGET_BASE}, mode: ${MODE})."
