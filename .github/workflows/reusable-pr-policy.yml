name: Reusable - PR Policy

on:
  workflow_call:
    inputs:
      required_base_branch:
        description: "Base branch agent PRs must target"
        type: string
        default: "develop"
      require_agent_branch_prefix:
        description: "Required branch name prefix for agent-authored PRs"
        type: string
        default: "agent/"
      allow_hotfix:
        description: "Exempt hotfix/* branches from the agent branch prefix requirement"
        type: boolean
        default: true
      check_project_fields:
        description: "Opt-in: fail the PR check if its Project item is missing required field values"
        type: boolean
        default: false
      project_owner:
        description: "GitHub org/user that owns the Project (required when check_project_fields is true)"
        type: string
        default: ""
      project_number:
        description: "GitHub Project (v2) number (required when check_project_fields is true)"
        type: string
        default: ""
      required_project_fields:
        description: "Comma-separated Project field names that must be non-empty on the PR's item"
        type: string
        default: "Agent,Area,Risk,Environment,Base Branch,Branch,PR URL"
    secrets:
      project_token:
        description: "PAT with the 'project' scope. Required when check_project_fields is true — the default GITHUB_TOKEN cannot read Projects (v2)."
        required: false

jobs:
  policy:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    steps:
      - name: Check base branch and branch prefix
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.ref }}'
          head='${{ github.event.pull_request.head.ref }}'
          required_base='${{ inputs.required_base_branch }}'
          prefix='${{ inputs.require_agent_branch_prefix }}'
          allow_hotfix='${{ inputs.allow_hotfix }}'

          fail=0

          if [ "$base" != "$required_base" ]; then
            echo "::error::PR targets base '$base' but the required base branch is '$required_base'."
            fail=1
          else
            echo "OK: base branch '$base' matches required '$required_base'."
          fi

          is_hotfix=0
          case "$head" in
            hotfix/*) is_hotfix=1 ;;
          esac

          case "$head" in
            "$prefix"*)
              echo "OK: branch '$head' has required prefix '$prefix'."
              ;;
            *)
              if [ "$allow_hotfix" = "true" ] && [ "$is_hotfix" = "1" ]; then
                echo "OK: branch '$head' is exempt from the '$prefix' prefix requirement (hotfix)."
              else
                echo "::error::Branch '$head' does not start with required prefix '$prefix' (and is not an allowed hotfix/* branch)."
                fail=1
              fi
              ;;
          esac

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

  project-fields:
    runs-on: ubuntu-latest
    if: |
      inputs.check_project_fields &&
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
    env:
      GH_TOKEN: ${{ secrets.project_token }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.project_token }}" ]; then
            echo "::error::check_project_fields is true but secrets.project_token was not provided. Pass a PAT with the 'project' scope."
            exit 1
          fi
          if [ -z "${{ inputs.project_owner }}" ] || [ -z "${{ inputs.project_number }}" ]; then
            echo "::error::check_project_fields is true but project_owner/project_number inputs are empty."
            exit 1
          fi

      - name: Resolve Project item for this PR
        id: item
        shell: bash
        run: |
          set -euo pipefail
          pr_url='${{ github.event.pull_request.html_url }}'
          item_json="$(gh project item-add '${{ inputs.project_number }}' --owner '${{ inputs.project_owner }}' --url "$pr_url" --format json)"
          item_id="$(echo "$item_json" | jq -r '.id')"
          if [ -z "$item_id" ] || [ "$item_id" = "null" ]; then
            echo "::error::Could not resolve a Project item for $pr_url. Check project_owner/project_number and that project_token has the 'project' scope."
            exit 1
          fi
          echo "id=$item_id" >> "$GITHUB_OUTPUT"

      - name: Check required fields are non-empty
        shell: bash
        run: |
          set -euo pipefail
          fields_json="$(gh api graphql -f query='
            query($id: ID!) {
              node(id: $id) {
                ... on ProjectV2Item {
                  fieldValues(first: 50) {
                    nodes {
                      ... on ProjectV2ItemFieldTextValue { text field { ... on ProjectV2FieldCommon { name } } }
                      ... on ProjectV2ItemFieldSingleSelectValue { name field { ... on ProjectV2FieldCommon { name } } }
                      ... on ProjectV2ItemFieldDateValue { date field { ... on ProjectV2FieldCommon { name } } }
                      ... on ProjectV2ItemFieldNumberValue { number field { ... on ProjectV2FieldCommon { name } } }
                    }
                  }
                }
              }
            }' -f id='${{ steps.item.outputs.id }}')"

          IFS=',' read -r -a required <<< "${{ inputs.required_project_fields }}"
          missing=()
          for raw_name in "${required[@]}"; do
            name="$(echo "$raw_name" | sed 's/^ *//;s/ *$//')"
            [ -n "$name" ] || continue
            value="$(echo "$fields_json" | jq -r --arg n "$name" '
              .data.node.fieldValues.nodes[]
              | select(.field.name == $n)
              | if has("text") then .text
                elif has("name") then .name
                elif has("date") then .date
                elif has("number") then (.number | tostring)
                else "" end
            ' | head -n1)"
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Project fields left blank on this PR's item: ${missing[*]}. Fill them via scripts/project/create_agent_pr.sh --agent/--area/--risk/--environment (or scripts/project/sync_project_fields.sh) before requesting review."
            exit 1
          fi

          echo "OK: all required Project fields are set (${{ inputs.required_project_fields }})."
