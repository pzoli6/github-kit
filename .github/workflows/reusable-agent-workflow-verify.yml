name: Reusable - Agent Workflow Verify

on:
  workflow_call:
    inputs:
      require_claude:
        description: "Require Claude Code adapter files (CLAUDE.md, .claude/skills/...)"
        type: boolean
        default: true
      require_cursor:
        description: "Require Cursor rule files (.cursor/rules/...)"
        type: boolean
        default: true
      require_skills:
        description: "Require the generic agent skill (.agents/skills/...)"
        type: boolean
        default: true
      require_gemini:
        description: "Require the Gemini CLI adapter file (GEMINI.md). Default false so repos that
          installed github-kit before Gemini support shipped don't fail until they refresh."
        type: boolean
        default: false
      require_copilot:
        description: "Deprecated, ignored. The kit no longer ships a GitHub Copilot adapter file; the
          input stays so callers that still pass it keep working."
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # Actions-budget pause switch: while the caller repo's Actions variable KIT_ACTIONS_PAUSED is
    # 'true', every github-kit job skips and consumes no Actions minutes, leaving the account's
    # shared Actions budget to other work. See templates/docs/ai/AGENT_WORKFLOW.md → "Actions budget".
    if: vars.KIT_ACTIONS_PAUSED != 'true'
    # Cancel a run superseded by a newer push to the same PR; never cancel base-branch push runs.
    concurrency:
      group: github-kit-verify-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v5

      # The required files and key phrases are not listed here: the caller repo's own
      # scripts/project/verify_agent_workflow.sh reads them from docs/ai/KIT_MANIFEST.tsv, so the
      # CI check and the local check can never disagree. Repos installed before the manifest
      # existed run their older copy of the script, which honors the same REQUIRE_* switches.
      - name: Verify required agent workflow files and key phrases
        shell: bash
        env:
          REQUIRE_CLAUDE: ${{ inputs.require_claude }}
          REQUIRE_CURSOR: ${{ inputs.require_cursor }}
          REQUIRE_SKILLS: ${{ inputs.require_skills }}
          REQUIRE_GEMINI: ${{ inputs.require_gemini }}
        run: |
          set -uo pipefail
          script=scripts/project/verify_agent_workflow.sh
          if [ ! -f "$script" ]; then
            echo "::error::Missing required file: $script. Run /github_kit_update (or scripts/update-github-kit.sh from pzoli6/github-kit) to restore it."
            exit 1
          fi
          bash "$script" 2>&1 | tee "$RUNNER_TEMP/verify.log"
          status="${PIPESTATUS[0]}"
          # Surface each problem as an annotation on the run summary.
          grep -E '^(MISSING|MISMATCH)' "$RUNNER_TEMP/verify.log" | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit "$status"
