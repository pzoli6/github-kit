name: PR Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  policy:
    uses: pzoli6/github-kit/.github/workflows/reusable-pr-policy.yml@main
    with:
      # TODO: confirm this matches Base branch in docs/ai/PROJECT_CONFIG.md
      required_base_branch: develop
      # Comma-separated allowlist. agent/ is what the kit's own scripts create; claude/ and
      # codex/ are what hosted agent platforms (Claude Code on the web, Codex cloud) assign on
      # their own — they can't push to a differently-named branch without per-session approval,
      # so rejecting their prefix only produces duplicate PRs and permanently red checks.
      require_agent_branch_prefix: "agent/,claude/,codex/"
      allow_hotfix: true
      # Require a human-authorization marker in the PR body for any PR that targets the
      # production branch directly. See "Production-branch approval gate (CI)" in
      # docs/ai/PROJECT_CONFIG.md and "Production-branch gate (approve main)" in AGENTS.md.
      production_branch: main
      require_production_branch_approval: true
      # production_branch_marker: "Production-branch authorization: approve main"  # default
      # Opt-in Project field completeness gate — off until Project Sync is configured and
      # working. See "Project field completeness gate (CI)" in docs/ai/PROJECT_CONFIG.md.
      check_project_fields: false
      # project_owner: pzoli6
      # project_number: "TBD"
    # secrets:
    #   project_token: ${{ secrets.AGENT_PROJECT_TOKEN }}
