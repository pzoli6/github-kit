name: CI (Node)

# Paused (consuming no Actions minutes) while the repository Actions variable KIT_ACTIONS_PAUSED
# is 'true'. See docs/ai/AGENT_WORKFLOW.md → "Actions budget".
#
# Budget-first triggers: CI does NOT run automatically on preview-bound work (PRs into the base
# branch, pushes to it). It runs only when explicitly dispatched — by a human, or by an AI agent
# a human told to run CI (Actions tab → Run workflow, or:
#   gh workflow run "CI (Node)" --ref <branch>
# ) — or when a change is production-bound (PR targeting the production branch, push to it).
# Agents validate locally per docs/ai/PROJECT_CONFIG.md → "Validation commands" either way.
#
# Actions-budget tier, set by the github-kit updater (--tier, or the fan-out's
# .github/fanout-targets.json). Tier 1 keeps the automatic production-bound triggers between the
# markers below; tier 2 drops them, so this workflow runs only when dispatched by hand. The updater
# keeps whatever tier this line says unless told otherwise.
# github-kit tier: 1

on:
  workflow_dispatch:
  # >>> github-kit tier-1 triggers
  pull_request:
    # TODO: confirm this matches Production branch in docs/ai/PROJECT_CONFIG.md
    branches: [main]
  push:
    branches: [main]
  # <<< github-kit tier-1 triggers

jobs:
  ci:
    uses: pzoli6/github-kit/.github/workflows/reusable-ci-node.yml@main
    with:
      node_version: "22"
      package_manager: npm
      run_build: true
      run_lint: true
      run_test: true
