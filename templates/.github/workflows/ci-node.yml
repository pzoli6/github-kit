name: CI (Node)

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  ci:
    uses: pzoli6/github-kit/.github/workflows/reusable-ci-node.yml@GITHUB_KIT_VERSION
    with:
      node_version: "22"
      package_manager: npm
      run_build: true
      run_lint: true
      run_test: true
