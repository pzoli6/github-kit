name: Agent Workflow Verify

# Paused (consuming no Actions minutes) while the repository Actions variable KIT_ACTIONS_PAUSED
# is 'true' — e.g. to keep the Actions budget free for manual GitHub Copilot coding agent runs.
# See docs/ai/AGENT_WORKFLOW.md → "Actions budget and manual Copilot use".

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  verify:
    uses: pzoli6/github-kit/.github/workflows/reusable-agent-workflow-verify.yml@main
    with:
      require_claude: true
      require_cursor: true
      require_skills: true
      require_gemini: true
      # The Copilot adapter file is inert text and needs no subscription to keep; set false only
      # if this repo deliberately removed .github/copilot-instructions.md.
      require_copilot: true
