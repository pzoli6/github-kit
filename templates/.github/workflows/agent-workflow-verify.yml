name: Agent Workflow Verify

# Paused (consuming no Actions minutes) while the repository Actions variable KIT_ACTIONS_PAUSED
# is 'true' — e.g. to keep the Actions budget free for manual GitHub Copilot coding agent runs.
# See docs/ai/AGENT_WORKFLOW.md → "Actions budget and manual Copilot use".
#
# Budget-first triggers: like the CI workflows, verification does NOT run automatically on
# preview-bound work — only when explicitly dispatched (Actions tab → Run workflow, or
# `gh workflow run "Agent Workflow Verify" --ref <branch>`) or when a change is production-bound.
# scripts/project/verify_agent_workflow.sh runs the same checks locally for free.
#
# Actions-budget tier, set by the github-kit updater (--tier, or the fan-out's
# .github/fanout-targets.json). Tier 1 keeps the automatic production-bound triggers between the
# markers below; tier 2 drops them, so this workflow runs only when dispatched by hand. The updater
# keeps whatever tier this line says unless told otherwise.
# github-kit tier: 1

on:
  workflow_dispatch:
  # >>> github-kit tier-1 triggers
  pull_request:
    # TODO: confirm this matches Production branch in docs/ai/PROJECT_CONFIG.md
    branches: [main]
  push:
    branches: [main]
  # <<< github-kit tier-1 triggers

jobs:
  verify:
    uses: pzoli6/github-kit/.github/workflows/reusable-agent-workflow-verify.yml@main
    with:
      require_claude: true
      require_cursor: true
      require_skills: true
      require_gemini: true
      # The Copilot adapter file is inert text and needs no subscription to keep; set false only
      # if this repo deliberately removed .github/copilot-instructions.md.
      require_copilot: true
