name: Project Sync

# Paused (skipping Status updates, consuming no Actions minutes) while the repository Actions
# variable KIT_ACTIONS_PAUSED is 'true' — e.g. to keep the Actions budget free for manual GitHub
# Copilot coding agent runs. See docs/ai/AGENT_WORKFLOW.md → "Actions budget and manual Copilot use".

on:
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, ready_for_review, closed]

jobs:
  sync:
    uses: pzoli6/github-kit/.github/workflows/reusable-project-sync.yml@main
    with:
      # TODO: replace with this repo's values from docs/ai/PROJECT_CONFIG.md
      project_owner: pzoli6
      project_number: "TBD"
      status_on_issue_open: Backlog
      status_on_pr_open: "In Review"
      status_on_pr_ready: "In Review"
      status_on_close: Done
    secrets:
      project_token: ${{ secrets.AGENT_PROJECT_TOKEN }}
